<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saque Infinito</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="zoneBox"><span id="zoneName">Zona 1</span><div id="zoneBar"><div id="zoneFill"></div><span id="zoneTxt">0/10</span></div></div>
    <div id="goldBox"><span id="gold">0</span></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="lvlBox"><span id="lvl">NV 1</span><div id="xpBar"><div id="xpFill"></div></div></div>
  </div>
  <main id="panel"></main>
  <nav id="tabs">
    <button data-tab="heroi" class="on">HERÓI</button>
    <button data-tab="mochila">MOCHILA <b id="bagCount">0</b></button>
    <button data-tab="mercado">MERCADO</button>
  </nav>
</div>
<div id="modal"></div>
<div id="toasts"></div>
<script src="game.js"></script>
</body>
</html>
